<!DOCTYPE html>
<html lang="end">
    <head>
        <title>Code Clicker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game-container">
            <header>
                <h1>Code Clicker</h1>
                <h2 id="score-display">1000 lines of code</h2>
                <button id="main-button" onclick="writeCode()">Write Code</button>
            </header>
            
            <main id="shop">
                <h3>Hardware Store (Manual Upgrade)</h3>
                <p>Current Click Power: <span id="power-display">1</span></p>
                <button id="upgrade-button" onclick="buyKeyboard()">
                    Buy Mechanical Keyboard (Cost: <span id="cost-display">50</span>)
                </button>
                
                <button id="upgrade-button" onclick="buyTypewriter()">
                    Buy Typewriter (Cost: <span id="cost-typewriter-display">100</span>)
                </button>

                <h3>Hiring Department (Auto Clicking)</h3>
                <p>Active Interns: <span id="intern-display">0</span></p>
                <button id="intern-button" onclick="buyIntern()">
                    Hire Intern (Cost: <span id="cost-intern-display">100</span>)
                </button>

                <p>Active Coders: <span id="coder-display">0</span></p>
                <button id="coder-button" onclick="buyCoder()">
                    Hire Coder (Cost: <span id="cost-coder-display">150</span>)
                </button>
            </main>

        </div>

        <script src="script.js"></script>
    </body>
</html>
