<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carolina Gameday Checklist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🏈 Carolina Gameday Checklist 🏈</h1>

    <p class="subtitle">Get ready to cheer on the Gamecocks!</p>

    <label for="itemInput">Add an item to your bag</label>

    <div class="input-area">
      <input
        type="text"
        id="itemInput"
        placeholder="e.g., Clear stadium bag"
      >

      <button id="addButton">Add to list</button>
    </div>

    <h2>Gameday Bag</h2>

    <ul id="checklist">
      <!-- Items added to the list will appear here -->
    </ul>

    <div class="garnet-line"></div>

    <p class="footer">GO COCKS! 🤙</p>

  </div>

  <script src="script.js"></script>

</body>
</html>
