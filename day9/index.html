<!DOCTYPE html>
<html lang="en">
<head>
  <title>Carolina Gameday Checklist</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      color: #4B9CD3;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 13px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #4B9CD3;
    }

    button {
      padding: 13px 18px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4B9CD3;
      color: white;
    }

    button:hover {
      background: #347EAD;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 25px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      margin-bottom: 10px;
      background: #f1f7fb;
      border-radius: 8px;
      border-left: 4px solid #4B9CD3;
    }

    li.completed span {
      text-decoration: line-through;
      color: #888;
    }

    li span {
      flex: 1;
      cursor: pointer;
    }

    .delete-button {
      background: #d9534f;
      padding: 7px 11px;
      font-size: 13px;
    }

    .delete-button:hover {
      background: #b52b27;
    }

    .empty-message {
      text-align: center;
      color: #888;
      padding: 15px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🏈 Carolina Gameday Checklist</h1>
    <p class="subtitle">Make sure you've got everything you need for gameday!</p>

    <label for="itemInput">Add an item to your bag</label>

    <div class="input-row">
      <input
        type="text"
        id="itemInput"
        placeholder="e.g., Clear stadium bag"
      >

      <button onclick="addItem()">Add to list</button>
    </div>

    <ul id="checklist">
      <li class="empty-message" id="emptyMessage">
        Your gameday bag is empty!
      </li>
    </ul>
  </div>

  <script>
    const itemInput = document.getElementById("itemInput");
    const checklist = document.getElementById("checklist");
    const emptyMessage = document.getElementById("emptyMessage");

    function addItem() {
      const itemText = itemInput.value.trim();

      if (itemText === "") {
        return;
      }

      // Remove the empty message
      if (emptyMessage) {
        emptyMessage.remove();
      }

      // Create a new list item
      const li = document.createElement("li");

      // Create checkbox
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";

      // Create item text
      const span = document.createElement("span");
      span.textContent = itemText;

      // Create delete button
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Remove";
      deleteButton.className = "delete-button";

      // Check/uncheck item
      checkbox.addEventListener("change", function () {
        li.classList.toggle("completed", checkbox.checked);
      });

      // Remove item
      deleteButton.addEventListener("click", function () {
        li.remove();

        if (checklist.children.length === 0) {
          const message = document.createElement("li");
          message.className = "empty-message";
          message.textContent = "Your gameday bag is empty!";
          message.id = "emptyMessage";
          checklist.appendChild(message);
        }
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteButton);

      checklist.appendChild(li);

      // Clear the textbox
      itemInput.value = "";

      // Put cursor back in textbox
      itemInput.focus();
    }

    // Allow pressing Enter to add an item
    itemInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        addItem();
      }
    });
  </script>

</body>
</html>
