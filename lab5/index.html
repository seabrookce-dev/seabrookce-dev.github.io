<!DOCTYPE html>
<!--
rework this code to represent a bank account
it should have two buttons, one to deposit, one to withdraw

in the javascript, create 2 functions, one to deposit, one to withdraw
-->
<html>
    <head>
        <title>Javascript Example</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="Your-Account">
            <p class="Bank-Account">Welcome to Bank of America</p>

            <h2>Your Bank Account</h2>

            <p>Current Balance: <span id="current-balance">100</span></p>
            <p id="status-message">Would you like to withdraw?</p>

            <button onclick="withdraw-twenty()">Withdraw $20</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
