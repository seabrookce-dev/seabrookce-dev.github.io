<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Search Results</title>
    </head>
    <body>
        <h2>Results Page: </h2>

        <script>

            const userSearch = params.get("query");
            document.write("You search for: " + userSearch);
        </script>

    </body>
